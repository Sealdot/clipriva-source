<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipRiva alpha.2 Quick Paste 原型</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        color: #18222c;
        background: #e8ebee;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px; }
      .review { max-width: 960px; margin: auto; }
      .review h1 { margin: 0 0 6px; font-size: 20px; }
      .review p { margin: 0 0 18px; color: #5c6670; font-size: 13px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
      .controls button {
        border: 1px solid #c9d0d5; border-radius: 7px; padding: 7px 11px;
        background: white; color: #18222c; font: inherit; font-size: 12px; cursor: pointer;
      }
      .controls button[aria-pressed="true"] { border-color: #167d68; color: #125e50; background: #e4f3ed; }
      .stage { display: grid; place-items: center; min-height: 500px; border: 1px dashed #b8c2c9; border-radius: 18px; }
      .window {
        --bg: #f5f6f7; --surface: #fff; --panel: #f0f2f4; --border: #dce1e5;
        --text: #18222c; --muted: #5c6670; --accent: #167d68; --selected: #e4f3ed;
        --on-accent: #fff; --warning: #9c5b00;
        display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto;
        width: 600px; height: 454px; overflow: hidden; border: 1px solid var(--border);
        border-radius: 12px; background: var(--surface); color: var(--text);
        box-shadow: 0 22px 60px #141e2633;
      }
      .window[data-theme="dark"] {
        --bg: #15191d; --surface: #1d2329; --panel: #242c33; --border: #3a4650;
        --text: #f2f5f6; --muted: #a6b2bc; --accent: #72d6b6; --selected: #243d35;
        --on-accent: #102019; --warning: #f0bc6a;
      }
      .bar { display: flex; align-items: center; justify-content: space-between; height: 43px; padding: 0 16px; }
      .scope { color: var(--muted); font-size: 12px; }
      .scope strong { color: var(--text); font-weight: 600; }
      .status { color: var(--muted); font-size: 11px; }
      .status::before { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--accent); content: ""; }
      .search { display: flex; align-items: center; gap: 10px; height: 42px; margin: 0 16px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--bg); }
      .search svg { color: var(--muted); flex: none; }
      .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
      .search input::placeholder { color: var(--muted); }
      .hint { display: flex; align-items: center; justify-content: space-between; height: 33px; padding: 0 17px; color: var(--muted); font-size: 11px; }
      .list { min-height: 0; overflow: auto; padding: 0 8px; }
      .row { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 59px; border: 0; border-radius: 7px; padding: 7px 9px; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
      .row + .row { border-top: 1px solid var(--border); border-radius: 0; }
      .row[aria-selected="true"] { border-color: transparent; border-radius: 7px; background: var(--selected); }
      .type { display: grid; flex: none; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 700; }
      .body { min-width: 0; flex: 1; }
      .body strong, .body small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .body strong { font-size: 13px; font-weight: 550; }
      .body small { margin-top: 4px; color: var(--muted); font-size: 11px; }
      .row .chevron { color: var(--muted); font-size: 18px; }
      .empty { display: grid; place-content: center; gap: 9px; height: 100%; padding: 22px; text-align: center; }
      .empty strong { font-size: 14px; }
      .empty span { color: var(--muted); font-size: 12px; }
      .feedback { display: none; margin: 5px 16px; border: 1px solid var(--warning); border-radius: 8px; padding: 10px 12px; color: var(--text); background: var(--bg); font-size: 12px; }
      .feedback strong { display: block; margin-bottom: 3px; }
      .feedback span { color: var(--muted); }
      .window[data-state="degraded"] .feedback { display: block; }
      .footer { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: 1px solid var(--border); padding: 0 16px; }
      .keyhints { flex: 1; color: var(--muted); font-size: 11px; }
      kbd { display: inline-block; border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; background: var(--panel); font: 10px ui-monospace, SFMono-Regular, monospace; }
      .more, .primary { min-height: 32px; border-radius: 7px; padding: 0 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
      .more { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
      .primary { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
      .primary:disabled { opacity: .45; cursor: default; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .menu { display: none; position: absolute; z-index: 2; right: 16px; bottom: 47px; width: 198px; border: 1px solid var(--border); border-radius: 8px; padding: 5px; background: var(--surface); box-shadow: 0 8px 30px #0004; }
      .menu[data-open="true"] { display: grid; }
      .menu button { border: 0; border-radius: 5px; padding: 8px; background: transparent; color: var(--text); text-align: left; font: inherit; font-size: 12px; }
      .menu button:hover { background: var(--selected); }
      .caption { margin-top: 14px; color: #5c6670; font-size: 12px; text-align: center; }
      @media (max-width: 640px) { body { padding: 16px 8px; } .stage { display: block; min-height: 0; } .window { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="review">
      <h1>Quick Paste · alpha.2 关键 UI 原型</h1>
      <p>仅用于确认信息层级与文案。样例均为合成内容，尚未接入 React/Tauri 或系统剪贴板。</p>
      <div class="controls">
        <button type="button" data-theme-button="light" aria-pressed="true">浅色</button>
        <button type="button" data-theme-button="dark" aria-pressed="false">深色</button>
        <button type="button" data-state-button="default" aria-pressed="true">默认列表</button>
        <button type="button" data-state-button="empty" aria-pressed="false">无结果</button>
        <button type="button" data-state-button="degraded" aria-pressed="false">权限降级</button>
      </div>
      <div class="stage">
        <main class="window" data-theme="light" data-state="default" aria-label="Quick Paste 原型">
          <div class="bar"><span class="scope"><strong>全部历史</strong> · 本机内容</span><span class="status">正在采集</span></div>
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
            <input type="search" aria-label="搜索全部历史" placeholder="搜索复制过的内容、备注或来源" />
            <kbd>Esc</kbd>
          </label>
          <div class="hint"><span>最近使用</span><span>↑ ↓ 选择</span></div>
          <div class="list" role="listbox" aria-label="搜索结果">
            <button type="button" class="row" role="option" aria-selected="true"><span class="type">文</span><span class="body"><strong>版本规划 · 体验升级讨论</strong><small>文本 · 备忘录 · 2 分钟前</small></span><span class="chevron">›</span></button>
            <button type="button" class="row" role="option" aria-selected="false"><span class="type">链</span><span class="body"><strong>https://example.test/docs/alpha-2</strong><small>链接 · 浏览器 · 18 分钟前</small></span><span class="chevron">›</span></button>
            <button type="button" class="row" role="option" aria-selected="false"><span class="type">码</span><span class="body"><strong>const user_id = "sample-42";</strong><small>代码 · 编辑器 · 昨天</small></span><span class="chevron">›</span></button>
            <button type="button" class="row" role="option" aria-selected="false"><span class="type">文</span><span class="body"><strong>发布公告草稿</strong><small>命中备注 · 文本 · 昨天</small></span><span class="chevron">›</span></button>
          </div>
          <div class="feedback" role="status"><strong>已复制到剪贴板</strong><span>无法向原应用发送粘贴命令。请返回原应用按 ⌘V；不会自动重试。</span></div>
          <div class="footer">
            <span class="keyhints"><kbd>↵</kbd> 复制 &nbsp; <kbd>⌘K</kbd> 更多</span>
            <div class="menu" data-open="false">
              <button type="button">复制为纯文本</button><button type="button">直接粘贴…</button><button type="button">临时预览</button><button type="button">保存 / 加入待用队列</button>
            </div>
            <button type="button" class="more" aria-expanded="false">更多</button>
            <button type="button" class="primary">复制到剪贴板</button>
          </div>
        </main>
      </div>
      <div class="caption">600 × 454 逻辑尺寸基准 · 单一主动作 · 无常驻详情与 Labs 导航</div>
    </div>
    <script>
      const windowEl = document.querySelector('.window');
      const list = document.querySelector('.list');
      const rows = [...document.querySelectorAll('.row')];
      const search = document.querySelector('.search input');
      const menu = document.querySelector('.menu');
      const more = document.querySelector('.more');
      const primary = document.querySelector('.primary');
      const initialList = list.innerHTML;
      function setPressed(selector, value, attribute) {
        document.querySelectorAll(selector).forEach(button => {
          button.setAttribute('aria-pressed', button.dataset[attribute] === value);
        });
      }
      document.querySelectorAll('[data-theme-button]').forEach(button => {
        button.addEventListener('click', () => {
          windowEl.dataset.theme = button.dataset.themeButton;
          setPressed('[data-theme-button]', button.dataset.themeButton, 'themeButton');
        });
      });
      document.querySelectorAll('[data-state-button]').forEach(button => {
        button.addEventListener('click', () => {
          const state = button.dataset.stateButton;
          windowEl.dataset.state = state;
          setPressed('[data-state-button]', state, 'stateButton');
          list.innerHTML = state === 'empty' ? '<div class="empty"><strong>当前范围没有结果</strong><span>搜索范围：全部历史。可清除搜索后查看最近内容。</span></div>' : initialList;
          document.querySelector('.hint span').textContent = state === 'empty' ? '全部历史' : '最近使用';
          primary.disabled = state === 'empty';
        });
      });
      list.addEventListener('click', event => {
        const row = event.target.closest('.row');
        if (!row) return;
        list.querySelectorAll('.row').forEach(item => {
          item.setAttribute('aria-selected', item === row);
        });
      });
      more.addEventListener('click', () => {
        const open = menu.dataset.open !== 'true';
        menu.dataset.open = String(open);
        more.setAttribute('aria-expanded', String(open));
      });
      search.addEventListener('input', () => {
        const term = search.value.trim().toLocaleLowerCase();
        const visible = rows.filter(row => row.textContent.toLocaleLowerCase().includes(term));
        if (!term || visible.length) {
          list.innerHTML = initialList;
          list.querySelectorAll('.row').forEach(row => { row.hidden = Boolean(term) && !row.textContent.toLocaleLowerCase().includes(term); });
        } else {
          list.innerHTML = '<div class="empty"><strong>当前范围没有结果</strong><span>搜索范围：全部历史。可清除搜索后查看最近内容。</span></div>';
        }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && menu.dataset.open === 'true') { menu.dataset.open = 'false'; more.setAttribute('aria-expanded', 'false'); }
        if (event.metaKey && event.key.toLowerCase() === 'k') { event.preventDefault(); more.click(); }
      });
    </script>
  </body>
</html>
