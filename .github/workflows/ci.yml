name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify macOS build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend formatting and lint
        run: pnpm lint
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Collect locked target dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/clipriva-source-evidence"
          mkdir -p "$evidence_dir"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$target"
          pnpm licenses list --json > "$RUNNER_TEMP/clipriva-node-licenses.json"
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --all-features \
            --filter-platform "$target" --format-version 1 > "$RUNNER_TEMP/clipriva-cargo-metadata.json"
          python3 scripts/review-dependency-licenses.py \
            --node-metadata "$RUNNER_TEMP/clipriva-node-licenses.json" \
            --cargo-metadata "$RUNNER_TEMP/clipriva-cargo-metadata.json" \
            --target "$target" --commit "$GITHUB_SHA" --output "$evidence_dir"
          pnpm audit --prod --registry=https://registry.npmjs.org --json \
            > "$evidence_dir/node-production-audit.json"
          {
            printf 'commit=%s\ntarget=%s\n' "$GITHUB_SHA" "$target"
            node --version
            pnpm --version
            rustc --version
            cargo --version
            sw_vers
            xcodebuild -version
          } > "$evidence_dir/environment.txt"
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: pnpm test:rust
      - name: Run explicitly ignored release-mode benchmarks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release -- --ignored --nocapture
      - name: Verify source tree remains clean
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload portable source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/clipriva-source-evidence/
          if-no-files-found: warn
          retention-days: 30
